apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgrest-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/niliss/takehome.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: postgrest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false