apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: postgrest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v14.1
          ports:
            - containerPort: 3000
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgrest-db-secret
                  key: PGRST_DB_URI
            - name: PGRST_DB_SCHEMAS
              value: "api"
            - name: PGRST_DB_ANON_ROLE
              valueFrom:
                secretKeyRef:
                  name: postgrest-db-secret
                  key: DB_USER
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest
  namespace: postgrest
spec:
  selector:
    app: postgrest
  ports:
    - port: 3000
      targetPort: 3000